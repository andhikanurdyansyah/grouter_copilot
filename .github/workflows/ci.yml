# CI deterministik — tidak menyentuh production: tanpa secret, tanpa DB produksi,
# tanpa request mutating ke jaringan luar. Data test selalu instance terisolasi.
#
# Node >= 22.13 wajib: modul `node:sqlite` (dipakai isolasi test/E2E) baru
# tersedia tanpa flag sejak 22.13/23.4. Matrix memakai 22.x (>= 22.13).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x']
    env:
      NODE_ENV: test
      E2E_BACKEND_PORT: '4690'
      E2E_FRONTEND_PORT: '4691'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Dependency audits use tracked lockfiles only; no install/update and no secrets.
      - name: Dependency audit
        run: npm run audit:dependencies

      # Backend deps (better-auth / better-sqlite3). server/ pins with npm.
      - name: Install server deps
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Install frontend deps (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Root plugin suite (zero-dependency; node:test). Includes the E2E
      # isolation-guard, hardening, and mock-upstream regressions.
      - name: Root suite
        run: npm test

      # Backend suite (isolated temp auth DB + temp store under NODE_ENV=test).
      - name: Server suite
        run: npm run test:server

      - name: Typecheck (tsc -b --noEmit)
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint (eslint, errors only)
        working-directory: frontend
        run: npx eslint . --max-warnings=999

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Isolated E2E: boots a disposable instance (temp auth DB + temp store +
      # mock upstream, ports 4690/4691) and tears it down. Never touches a real
      # service. Fails closed if anything points at production.
      - name: Isolated E2E
        run: npm run e2e

  cleanroom:
    name: clean-room installer (ESM + CJS)
    runs-on: ubuntu-latest
    needs: test
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # The clean-room script boots a disposable isolated license server, which
      # needs the backend deps (better-auth). It installs the packed tarball with
      # npm in throwaway dirs; the frontend deps are not needed.
      - name: Install server deps
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Clean-room matrix
        run: bash scripts/cleanroom-verify.sh
