# Publish @grouter/copilot ke npm lewat trusted publishing (OIDC).
#
# Kenapa bukan token: sejak changelog GitHub 2026-07-08, token granular dengan
# bypass-2FA kehilangan kemampuan publish langsung, dan publish langsung dengan
# token dihapus penuh sekitar Januari 2027. Rilis 0.1.0 sendiri harus lewat
# staged publishing + approval 2FA manusia (lihat D-028 di decision log).
#
# Trusted publishing menghapus akar masalahnya: tidak ada token panjang umur
# yang bisa bocor, dan tidak perlu approval manual setiap rilis. npm memverifikasi
# identitas workflow lewat OIDC - GitHub menandatangani assertion per run.
#
# PRASYARAT SEKALI SAJA (di npmjs.com, tidak bisa dilakukan dari repo):
#   Package @grouter/copilot -> Settings -> Trusted Publishing -> Add publisher
#     Owner            andhikanurdyansyah
#     Repository       grouter_copilot
#     Workflow name    publish.yml
#     Environment      npm-publish
# Setelah itu workflow ini bisa menerbitkan tanpa token apa pun.
#
# Sengaja dipisah dari ci.yml: CI berjalan tanpa secret dan tanpa izin tulis.
# Workflow ini hanya punya id-token write (untuk OIDC) + contents read.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack dan verifikasi tanpa benar-benar menerbitkan'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # wajib untuk OIDC trusted publishing

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # Node 22.14+ diperlukan oleh npm CLI 11.15+ untuk staged/trusted publish.
      # npm 12 dipakai karena itu versi yang membawa alur trusted publishing
      # yang stabil.
      # npm 12.2.0 butuh node ^22.22.2 || ^24.15.0 || >=26. Pin persis: '22.x'
      # bisa memasang 22.14 (terlalu tua) dan `npm install -g npm@12` gagal.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'

      # JANGAN `npm install -g npm@12`: itu menimpa tree npm bawaan toolcache
      # saat npm lama masih berjalan, dan pada runner hosted gagal dengan
      # "MODULE_NOT_FOUND: Cannot find module 'promise-retry'" sebelum satu pun
      # gate berjalan. Pasang ke prefix terpisah lalu taruh di depan PATH.
      - name: Install npm 12 into an isolated prefix
        run: |
          npm install -g npm@12 --prefix "$RUNNER_TEMP/npm12"
          echo "$RUNNER_TEMP/npm12/bin" >> "$GITHUB_PATH"

      - name: Verify npm version
        run: |
          INSTALLED=$(npm --version)
          echo "npm $INSTALLED"
          case "$INSTALLED" in
            12.*) ;;
            *) echo "FAIL expected npm 12.x, got $INSTALLED"; exit 1 ;;
          esac

      # Gate: jangan pernah menerbitkan paket yang test-nya merah.
      #
      # Root suite BUKAN zero-dependency: empat test isolasi E2E menyusun schema
      # better-auth di child process dengan cwd server/, jadi `server/node_modules`
      # harus ada. Dry-run 2026-10-21 gagal 4 test dengan
      # "Cannot find package 'better-auth'" karena langkah ini belum ada.
      - name: Install server deps
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Root suite
        run: npm test

      - name: Verify package metadata
        run: |
          node -e "
          const p = require('./package.json');
          const fail = (m) => { console.error('FAIL ' + m); process.exit(1); };
          if (!p.name.startsWith('@grouter/')) fail('unexpected package name ' + p.name);
          if (p.private) fail('package.json is private');
          if (!p.repository || !p.repository.url) fail('missing repository url');
          if (Object.keys(p.dependencies || {}).length) fail('runtime dependencies are not allowed');
          console.log('metadata ok ' + p.name + '@' + p.version);
          "

      - name: Pack and inspect
        run: |
          npm pack --silent
          TARBALL=$(ls -t ./*.tgz | head -1)
          echo "tarball $TARBALL"
          # Tidak boleh ada kredensial yang ikut terpaket.
          if tar -xzOf "$TARBALL" 2>/dev/null | grep -qiE 'xkeysib-|sk_live|BEGIN (RSA )?PRIVATE KEY|ADMIN_TOKEN='; then
            echo "FAIL credential material found in tarball"; exit 1
          fi
          echo "secret scan clean"

      # Trusted publishing: npm menukar OIDC token GitHub menjadi kredensial
      # publish jangka pendek. Tidak ada NPM_TOKEN.
      #
      # PRASYARAT di npmjs.com (sudah dikonfirmasi 2026-10-21): trusted publisher
      # untuk paket ini punya "Allow npm publish" TERCENTANG. Tanpa centang itu
      # konfigurasi pasca-3-Sep-2026 hanya mengizinkan `npm stage publish`, dan
      # baris di bawah akan gagal 403. Dengan centang itu, rilis langsung terbit
      # tanpa langkah approval manual.
      #
      # Kalau suatu saat centang itu dicabut, kembalikan ke `npm stage publish`
      # plus approval 2FA - jangan menambahkan token.
      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm publish --access public --provenance

      - name: Verify published version
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Published $VERSION; registry says:"
          npm view "@grouter/copilot@$VERSION" version dist.tarball

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
        run: echo "Dry run - paket lolos semua gate, tidak diterbitkan."
