<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — gRouter Copilot</title>
  <meta name="description" content="Create your gRouter Copilot account with email — manage licenses, purchases, and monitor usage." />
  <link rel="icon" href="/favicon.ico" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Geist via Google Fonts (300, 400, 500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            geist: ['Geist', 'sans-serif']
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-form {
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(79, 70, 229, 0.3);
      box-shadow:
        inset 0 0 30px rgba(79, 70, 229, 0.1),
        inset 0 0 60px rgba(59, 130, 246, 0.05),
        0 0 50px rgba(139, 92, 246, 0.15),
        0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .input-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .input-glass:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(79, 70, 229, 0.5);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
    }
    .btn-glass {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.8), rgba(139, 92, 246, 0.8));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(79, 70, 229, 0.3);
      transition: all 0.3s ease;
    }
    .btn-glass:hover {
      background: linear-gradient(135deg, rgba(79, 70, 229, 1), rgba(139, 92, 246, 1));
      box-shadow: 0 0 30px rgba(79, 70, 229, 0.5);
      transform: translateY(-2px);
    }
    .btn-glass:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-glass:focus-visible, .glass:focus-visible { outline: 2px solid rgba(192, 132, 252, 0.8); outline-offset: 2px; }

    /* Scrollable form pada layar pendek (overflow hidden body tetap terjaga) */
    .form-scroll { max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    @media (prefers-reduced-motion: reduce) { .animate-float { animation: none !important; } }

    /* Error banner (gaya glass merah, konsisten tema) */
    .auth-error {
      display: flex; align-items: flex-start; gap: 10px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #f87171;
      border-radius: 0.75rem;
      padding: 10px 14px;
      font-size: 13.5px; line-height: 1.5;
      margin-bottom: 1rem;
    }
    .auth-error[hidden] { display: none; }

    /* Brand */
    .brand {
      position: fixed; top: 20px; left: 24px; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      color: #fff; text-decoration: none;
      font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 28px; height: 28px;
      display: grid; place-content: center;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(79,70,229,.9), rgba(139,92,246,.9));
      font-size: 13px; font-weight: 700;
    }

    .hint { margin: 6px 2px 0; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body class="font-geist">
  <div id="container"></div>

  <!-- Brand -->
  <a class="brand" href="/copilot">
    <span class="brand-mark">G</span> gRouter Copilot
  </a>

  <div class="fixed inset-0 flex items-center justify-center p-4 z-10">
    <div class="w-full max-w-md animate-float">
      <div class="glass-form rounded-3xl p-8 relative overflow-hidden form-scroll" id="authPanel" aria-labelledby="authTitle">
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl glass mb-4">
            <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <h1 class="text-2xl font-semibold text-white mb-2" id="authTitle">Create your account</h1>
          <p class="text-gray-400 text-sm" id="authSub">Sign up with your email to get started</p>
        </div>

        <div id="authError" class="auth-error" role="alert" aria-live="polite" hidden></div>

        <!-- Sign Up Form -->
        <form id="signupForm" class="space-y-6" novalidate>
          <div class="space-y-4">
            <div>
              <label for="suName" class="block text-sm font-medium text-gray-300 mb-2">Full name</label>
              <input id="suName" name="name" type="text" autocomplete="name" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your name" required="" aria-required="true">
            </div>
            <div>
              <label for="suEmail" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
              <input id="suEmail" name="email" type="email" autocomplete="email" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your email" required="" aria-required="true">
            </div>
            <div>
              <label for="suPassword" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
              <input id="suPassword" name="password" type="password" autocomplete="new-password" minlength="8" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your password" required="" aria-required="true" aria-describedby="suPasswordHint">
              <p class="hint" id="suPasswordHint">At least 8 characters.</p>
            </div>
          </div>

          <button type="submit" id="registerBtn" class="w-full py-3 px-4 btn-glass text-white font-medium rounded-xl">
            Create Account
          </button>
        </form>

        <!-- Toggle -->
        <p class="text-center text-sm text-gray-400 mt-6">
          Already have an account?
          <a href="/login" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    /* ================= AURORA SHADER BACKGROUND (referensi asli) ================= */
    let scene, camera, renderer, material;
    let startTime = Date.now();

    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float iTime;
        uniform vec2 iResolution;
        varying vec2 vUv;

        #define S smoothstep

        vec4 Line(vec2 uv, float speed, float height, vec3 col) {
            uv.y += S(1., 0., abs(uv.x)) * sin(iTime * speed + uv.x * height) * 0.2;
            return vec4(S(0.06 * S(0.2, 0.9, abs(uv.x)), 0., abs(uv.y) - 0.004) * col, 1.0) * S(1., 0.3, abs(uv.x));
        }

        void main() {
            vec2 uv = (vUv - 0.5) * vec2(iResolution.x / iResolution.y, 1.0);
            vec4 O = vec4(0.);

            for (float i = 0.; i <= 5.; i += 1.) {
                float t = i / 5.;
                float timeOffset = iTime * 0.3 + t * 2.0;

                vec3 auroraColor = vec3(
                    0.1 + 0.6 * sin(timeOffset + t * 3.14159),
                    0.3 + 0.7 * sin(timeOffset * 1.3 + t * 2.0),
                    0.4 + 0.6 * cos(timeOffset * 0.8 + t * 1.5)
                );

                auroraColor = mix(auroraColor, vec3(0.0, 0.8, 0.6), sin(timeOffset + t) * 0.5 + 0.5);
                auroraColor = mix(auroraColor, vec3(0.7, 0.2, 0.9), cos(timeOffset * 0.7 + t * 1.2) * 0.3 + 0.3);

                O += Line(uv, 1. + t * 0.8, 4. + t, auroraColor);
            }

            gl_FragColor = O;
        }
    `;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio * 2, 3));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

        material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth * 2, window.innerHeight * 2) }
            }
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.iTime.value = (Date.now() - startTime) * 0.001;
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.iResolution.value.set(window.innerWidth * 2, window.innerHeight * 2);
    }

    if (typeof THREE !== 'undefined') {
        window.addEventListener('resize', onWindowResize);
        init();
    }
    /* CDN gagal → background hitam, form tetap berfungsi penuh */

    /* ================= SIGN-UP WIRING (email only, tanpa social) ================= */
    (function () {
      'use strict';

      var signupForm = document.getElementById('signupForm');
      var errorBox = document.getElementById('authError');

      function showError(msg) {
        errorBox.textContent = msg || 'Something went wrong. Please try again.';
        errorBox.hidden = false;
      }
      function clearError() {
        errorBox.textContent = '';
        errorBox.hidden = true;
      }
      function parseError(data) {
        if (!data) return null;
        if (typeof data === 'string') return data;
        return data.message || data.error || (data.errors && data.errors[0] && data.errors[0].message) || null;
      }

      async function submitSignUp(payload, btn) {
        clearError();
        var label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        try {
          var res = await fetch('/api/auth/sign-up/email', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'same-origin',
          });
          var data = null;
          try { data = await res.json(); } catch (e) { data = null; }
          if (res.ok) {
            location.href = '/user';
            return;
          }
          showError(parseError(data) || ('Failed (' + res.status + '). Please try again.'));
        } catch (e) {
          showError('Cannot reach the server. Check your connection.');
        } finally {
          btn.disabled = false;
          btn.textContent = label;
        }
      }

      signupForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('suName').value.trim();
        var email = document.getElementById('suEmail').value.trim();
        var password = document.getElementById('suPassword').value;
        if (!name || !email || !password) { showError('All fields are required.'); return; }
        if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
        submitSignUp({ name: name, email: email, password: password }, document.getElementById('registerBtn'));
      });

      /* Surface OAuth/error param (tetap konsisten dengan alur existing) */
      try {
        var authErr = new URLSearchParams(location.search).get('error');
        if (authErr) {
          showError('Sign-up failed (' + authErr + '). Please try again.');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
