<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — gRouter Copilot</title>
  <meta name="description" content="Sign in to gRouter Copilot — manage licenses, purchases, and monitor usage." />
  <link rel="icon" href="/favicon.ico" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Geist via Google Fonts (300, 400, 500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            geist: ['Geist', 'sans-serif']
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-form {
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(79, 70, 229, 0.3);
      box-shadow:
        inset 0 0 30px rgba(79, 70, 229, 0.1),
        inset 0 0 60px rgba(59, 130, 246, 0.05),
        0 0 50px rgba(139, 92, 246, 0.15),
        0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .input-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .input-glass:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(79, 70, 229, 0.5);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
    }
    .btn-glass {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.8), rgba(139, 92, 246, 0.8));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(79, 70, 229, 0.3);
      transition: all 0.3s ease;
    }
    .btn-glass:hover {
      background: linear-gradient(135deg, rgba(79, 70, 229, 1), rgba(139, 92, 246, 1));
      box-shadow: 0 0 30px rgba(79, 70, 229, 0.5);
      transform: translateY(-2px);
    }
    .btn-glass:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-glass:focus-visible, .glass:focus-visible { outline: 2px solid rgba(192, 132, 252, 0.8); outline-offset: 2px; }

    /* Scrollable form pada layar pendek (overflow hidden body tetap terjaga) */
    .form-scroll { max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    @media (prefers-reduced-motion: reduce) { .animate-float { animation: none !important; } }

    /* Error banner (gaya glass merah, konsisten tema) */
    .auth-error {
      display: flex; align-items: flex-start; gap: 10px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #f87171;
      border-radius: 0.75rem;
      padding: 10px 14px;
      font-size: 13.5px; line-height: 1.5;
      margin-bottom: 1rem;
    }
    .auth-error[hidden] { display: none; }

    /* Brand */
    .brand {
      position: fixed; top: 20px; left: 24px; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      color: #fff; text-decoration: none;
      font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 28px; height: 28px;
      display: grid; place-content: center;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(79,70,229,.9), rgba(139,92,246,.9));
      font-size: 13px; font-weight: 700;
    }

    .hint { margin: 6px 2px 0; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body class="font-geist">
  <div id="container"></div>

  <!-- Brand -->
  <a class="brand" href="/copilot">
    <span class="brand-mark">G</span> gRouter Copilot
  </a>

  <div class="fixed inset-0 flex items-center justify-center p-4 z-10">
    <div class="w-full max-w-md animate-float">
      <div class="glass-form rounded-3xl p-8 relative overflow-hidden form-scroll" id="authPanel" aria-labelledby="authTitle">
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl glass mb-4">
            <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <h1 class="text-2xl font-semibold text-white mb-2" id="authTitle">Welcome Back</h1>
          <p class="text-gray-400 text-sm" id="authSub">Sign in to your account to continue</p>
        </div>

        <div id="authError" class="auth-error" role="alert" aria-live="polite" hidden></div>

        <!-- Sign In Form -->
        <form id="signinForm" class="space-y-6" novalidate>
          <div class="space-y-4">
            <div>
              <label for="siEmail" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
              <input id="siEmail" name="email" type="email" autocomplete="email" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your email" required="" aria-required="true">
            </div>
            <div>
              <label for="siPassword" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
              <input id="siPassword" name="password" type="password" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your password" required="" aria-required="true">
            </div>
          </div>

          <!-- Remember & Forgot -->
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center text-gray-300 cursor-pointer select-none">
              <input type="checkbox" class="w-4 h-4 rounded border-gray-600 bg-transparent mr-2">
              Remember me
            </label>
            <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors">
              Forgot password?
            </a>
          </div>

          <!-- Sign In Button -->
          <button type="submit" id="loginBtn" class="w-full py-3 px-4 btn-glass text-white font-medium rounded-xl">
            Sign In
          </button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="space-y-6" novalidate hidden>
          <div class="space-y-4">
            <div>
              <label for="suName" class="block text-sm font-medium text-gray-300 mb-2">Full name</label>
              <input id="suName" name="name" type="text" autocomplete="name" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your name" required="" aria-required="true">
            </div>
            <div>
              <label for="suEmail" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
              <input id="suEmail" name="email" type="email" autocomplete="email" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your email" required="" aria-required="true">
            </div>
            <div>
              <label for="suPassword" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
              <input id="suPassword" name="password" type="password" autocomplete="new-password" minlength="8" class="w-full px-4 py-3 rounded-xl input-glass text-white placeholder-gray-400 outline-none" placeholder="Enter your password" required="" aria-required="true" aria-describedby="suPasswordHint">
              <p class="hint" id="suPasswordHint">At least 8 characters.</p>
            </div>
          </div>

          <button type="submit" id="registerBtn" class="w-full py-3 px-4 btn-glass text-white font-medium rounded-xl">
            Create Account
          </button>
        </form>

        <!-- Social (tampil hanya bila /api/config mengonfirmasi provider aktif) -->
        <div id="socialBlock" hidden>
          <!-- Divider -->
          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-600"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-4 bg-transparent text-gray-400">Or continue with</span>
            </div>
          </div>

          <!-- Social Login -->
          <div class="grid grid-cols-1 gap-3" id="socialGrid">
            <button type="button" id="googleBtn" class="flex items-center justify-center py-3 px-4 glass rounded-xl text-gray-300 hover:text-white transition-colors">
              <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
              </svg>
              <span id="googleLabel">Google</span>
            </button>
          </div>
        </div>

        <!-- Toggle -->
        <p class="text-center text-sm text-gray-400 mt-6" id="footerSignup">
          Don't have an account?
          <a href="#signup" id="toSignup" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">Sign up</a>
        </p>
        <p class="text-center text-sm text-gray-400 mt-6" id="footerSignin" hidden>
          Already have an account?
          <a href="#signin" id="toSignin" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    /* ================= AURORA SHADER BACKGROUND (referensi asli) ================= */
    let scene, camera, renderer, material;
    let startTime = Date.now();

    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float iTime;
        uniform vec2 iResolution;
        varying vec2 vUv;

        #define S smoothstep

        vec4 Line(vec2 uv, float speed, float height, vec3 col) {
            uv.y += S(1., 0., abs(uv.x)) * sin(iTime * speed + uv.x * height) * 0.2;
            return vec4(S(0.06 * S(0.2, 0.9, abs(uv.x)), 0., abs(uv.y) - 0.004) * col, 1.0) * S(1., 0.3, abs(uv.x));
        }

        void main() {
            vec2 uv = (vUv - 0.5) * vec2(iResolution.x / iResolution.y, 1.0);
            vec4 O = vec4(0.);

            for (float i = 0.; i <= 5.; i += 1.) {
                float t = i / 5.;
                float timeOffset = iTime * 0.3 + t * 2.0;

                vec3 auroraColor = vec3(
                    0.1 + 0.6 * sin(timeOffset + t * 3.14159),
                    0.3 + 0.7 * sin(timeOffset * 1.3 + t * 2.0),
                    0.4 + 0.6 * cos(timeOffset * 0.8 + t * 1.5)
                );

                auroraColor = mix(auroraColor, vec3(0.0, 0.8, 0.6), sin(timeOffset + t) * 0.5 + 0.5);
                auroraColor = mix(auroraColor, vec3(0.7, 0.2, 0.9), cos(timeOffset * 0.7 + t * 1.2) * 0.3 + 0.3);

                O += Line(uv, 1. + t * 0.8, 4. + t, auroraColor);
            }

            gl_FragColor = O;
        }
    `;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio * 2, 3));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

        material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth * 2, window.innerHeight * 2) }
            }
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.iTime.value = (Date.now() - startTime) * 0.001;
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.iResolution.value.set(window.innerWidth * 2, window.innerHeight * 2);
    }

    if (typeof THREE !== 'undefined') {
        window.addEventListener('resize', onWindowResize);
        init();
    }
    /* CDN gagal → background hitam, form tetap berfungsi penuh */

    /* ================= AUTH WIRING (perilaku produksi existing) ================= */
    (function () {
      'use strict';

      var signupForm = document.getElementById('signupForm');
      var signinForm = document.getElementById('signinForm');
      var errorBox = document.getElementById('authError');
      var titleEl = document.getElementById('authTitle');
      var subEl = document.getElementById('authSub');
      var socialBlock = document.getElementById('socialBlock');
      var googleBtn = document.getElementById('googleBtn');
      var googleLabel = document.getElementById('googleLabel');
      var footerSignup = document.getElementById('footerSignup');
      var footerSignin = document.getElementById('footerSignin');

      var SIGNUP_COPY = {
        title: 'Create your account',
        sub: 'One account to manage licenses, purchases, and monitor usage.',
        doc: 'Sign up — gRouter Copilot',
      };
      var SIGNIN_COPY = {
        title: 'Welcome Back',
        sub: 'Sign in to your account to continue',
        doc: 'Sign in — gRouter Copilot',
      };

      function showError(msg) {
        errorBox.textContent = msg || 'Something went wrong. Please try again.';
        errorBox.hidden = false;
      }
      function clearError() {
        errorBox.textContent = '';
        errorBox.hidden = true;
      }
      function parseError(data) {
        if (!data) return null;
        if (typeof data === 'string') return data;
        return data.message || data.error || (data.errors && data.errors[0] && data.errors[0].message) || null;
      }

      function toggleForm(mode) {
        clearError();
        var isSignin = mode === 'signin';
        signupForm.hidden = isSignin;
        signinForm.hidden = !isSignin;
        footerSignup.hidden = !isSignin;  /* 'Don't have an account? Sign up' hanya di mode signin */
        footerSignin.hidden = isSignin;   /* 'Already have an account? Sign in' hanya di mode signup */
        var copy = isSignin ? SIGNIN_COPY : SIGNUP_COPY;
        titleEl.textContent = copy.title;
        subEl.textContent = copy.sub;
        document.title = copy.doc;
        try { history.replaceState(null, '', isSignin ? '#signin' : '#signup'); } catch (e) { /* ignore */ }
      }

      document.getElementById('toSignin').addEventListener('click', function (e) {
        e.preventDefault();
        toggleForm('signin');
      });
      document.getElementById('toSignup').addEventListener('click', function (e) {
        e.preventDefault();
        toggleForm('signup');
      });

      async function submitAuth(url, payload, btn) {
        clearError();
        var label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Processing...';
        try {
          var res = await fetch(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'same-origin',
          });
          var data = null;
          try { data = await res.json(); } catch (e) { data = null; }
          if (res.ok) {
            location.href = '/user';
            return;
          }
          showError(parseError(data) || ('Failed (' + res.status + '). Please try again.'));
        } catch (e) {
          showError('Cannot reach the server. Check your connection.');
        } finally {
          btn.disabled = false;
          btn.textContent = label;
        }
      }

      signupForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('suName').value.trim();
        var email = document.getElementById('suEmail').value.trim();
        var password = document.getElementById('suPassword').value;
        if (!name || !email || !password) { showError('All fields are required.'); return; }
        submitAuth('/api/auth/sign-up/email', { name: name, email: email, password: password }, document.getElementById('registerBtn'));
      });

      signinForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('siEmail').value.trim();
        var password = document.getElementById('siPassword').value;
        if (!email || !password) { showError('Email and password are required.'); return; }
        submitAuth('/api/auth/sign-in/email', { email: email, password: password }, document.getElementById('loginBtn'));
      });

      /* Google social — hanya bila backend menyatakan aktif via /api/config */
      function setGoogleBusy(busy) {
        if (busy) {
          googleBtn.setAttribute('aria-disabled', 'true');
          googleLabel.textContent = 'Connecting...';
        } else {
          googleBtn.removeAttribute('aria-disabled');
          googleLabel.textContent = 'Google';
        }
      }

      googleBtn.addEventListener('click', async function (e) {
        e.preventDefault();
        clearError();
        setGoogleBusy(true);
        try {
          var res = await fetch('/api/auth/sign-in/social', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              provider: 'google',
              callbackURL: location.origin + '/user',
              errorCallbackURL: location.origin + '/login',
            }),
            credentials: 'same-origin',
          });
          var data = null;
          try { data = await res.json(); } catch (err) { data = null; }
          if (res.ok && data && (data.url || data.redirect)) {
            window.location.href = data.url || data.redirect;
            return;
          }
          showError(parseError(data) || ('Google is unavailable (' + res.status + ').'));
        } catch (err) {
          showError('Cannot reach the server. Check your connection.');
        } finally {
          setGoogleBusy(false);
        }
      });

      function googleEnabled(cfg) {
        return !!(cfg && cfg.providers && cfg.providers.google === true);
      }

      fetch('/api/config', { credentials: 'same-origin' })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (cfg) {
          socialBlock.hidden = !googleEnabled(cfg);
        })
        .catch(function () {
          socialBlock.hidden = true;
        });

      /* Mode awal: /register → sign-up; selain itu sign-in. Deep link: #signup/#signin, ?mode= */
      var isRegisterPath = /\/register\/?$/.test(location.pathname);
      var qMode = null;
      try { qMode = new URLSearchParams(location.search).get('mode'); } catch (e) { /* ignore */ }
      var hash = location.hash;
      var wantsSignup = isRegisterPath || hash === '#signup' || qMode === 'signup';
      var wantsSignin = hash === '#signin' || qMode === 'signin';
      toggleForm(wantsSignup && !wantsSignin ? 'signup' : 'signin');

      /* Surface OAuth failure */
      try {
        var authErr = new URLSearchParams(location.search).get('error');
        if (authErr) {
          var authErrMsg = ({
            state_mismatch: 'Your Google session expired. Please try again.',
            invalid_code: 'Google login could not be verified. Please try again.',
            unable_to_get_user_info: 'Could not retrieve your Google account details.',
            email_not_found: 'Google did not provide your account email.',
            account_not_linked: 'This Google account is not linked yet. Sign up with email & password first.',
            oauth_account_already_linked: 'This email is already linked to another account.',
          })[authErr] || 'Google login failed (' + authErr + '). Please try again.';
          toggleForm('signin');
          showError(authErrMsg);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
